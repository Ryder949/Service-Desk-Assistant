<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kmart Team Assistant</title>

<style>
:root{
 --kmart-blue:#0053A0;
 --kmart-red:#E1251B;
 --success:#16A34A;
 --warning:#FBBF24;
 --danger:#DC2626;
 --light:#f4f6f8;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
 font-family:Arial,Helvetica,sans-serif;
}

body{
 background:var(--light);
}

.container{
 max-width:520px;
 margin:auto;
 background:white;
 min-height:100vh;
}

.header{
 background:var(--kmart-blue);
 color:white;
 padding:28px 20px;
}

.content{
 padding:20px;
}

.card{
 border:1px solid #ddd;
 border-radius:16px;
 padding:16px;
 margin-bottom:16px;
}

.option{
 border:2px solid #ddd;
 border-radius:14px;
 padding:16px;
 margin-bottom:12px;
 cursor:pointer;
}

.option:hover{
 border-color:var(--kmart-blue);
}

.selected{
 background:var(--kmart-blue);
 color:white;
 border-color:var(--kmart-blue);
}

.btn{
 width:100%;
 border:none;
 background:var(--kmart-blue);
 color:white;
 padding:16px;
 border-radius:14px;
 font-size:18px;
 cursor:pointer;
}

input[type=text]{
 width:100%;
 padding:16px;
 border:1px solid #ccc;
 border-radius:12px;
 font-size:18px;
}

.banner{
 padding:20px;
 border-radius:16px;
 text-align:center;
 font-size:26px;
 font-weight:bold;
 margin-bottom:15px;
}

.green{
 background:#16A34A;
 color:white;
}

.red{
 background:#DC2626;
 color:white;
}

.amber{
 background:#FBBF24;
 color:black;
}
</style>
</head>

<body>

<div class="container">
<div id="app"></div>
</div>

<script>

const app = document.getElementById("app");

const state = {
 product:"",
 receipt:null,
 reason:null,
 category:null,
 answers:{}
};

const categories = {
 footwear:[
  "shoe","runner","sneaker","boot","sandal"
 ],
 clothing:[
  "shirt","dress","hoodie","jeans","jacket"
 ],
 bedding:[
  "quilt","sheet","pillow",
  "air mattress","air bed"
 ],
 electrical:[
  "kettle","toaster","vacuum",
  "fan","heater","television","tv"
 ],
 toy:[
  "lego","doll","toy"
 ]
};

function detectCategory(product){

 const p = product.toLowerCase();

 for(const key in categories){
   if(categories[key].some(x => p.includes(x))){
      return key;
   }
 }

 return "general";
}

function home(){

 app.innerHTML=`

 <div class="header">
 <h1>Kmart Team Assistant</h1>
 </div>

 <div class="content">

 <h2>Return Assessment</h2>

 <br>

 <div class="card">

 <p>Proof of Purchase?</p>

 <br>

 <div class="option"
 onclick="setReceipt('yes')">
 Yes
 </div>

 <div class="option"
 onclick="setReceipt('no')">
 No
 </div>

 </div>

 </div>
 `;
}

function setReceipt(value){

 state.receipt=value;

 app.innerHTML=`

 <div class="header">
 <h1>Returns</h1>
 </div>

 <div class="content">

 <h2>What product is being returned?</h2>

 <br>

 <input
 id="product"
 type="text"
 placeholder="Example: Shoes">

 <br><br>

 <button
 class="btn"
 onclick="saveProduct()">
 Continue
 </button>

 </div>
 `;
}

function saveProduct(){

 state.product =
 document
 .getElementById("product")
 .value
 .trim();

 state.category =
 detectCategory(
 state.product
 );

 reasonScreen();
}

function reasonScreen(){

 app.innerHTML=`

 <div class="header">
 <h1>${state.product}</h1>
 </div>

 <div class="content">

 <h2>Reason for Return</h2>

 <br>

 <div class="option"
 onclick="setReason('change')">

 Change of Mind

 </div>

 <div class="option"
 onclick="setReason('faulty')">

 Faulty Product

 </div>

 <div class="option"
 onclick="setReason('damaged')">

 Damaged Product

 </div>

 </div>
 `;
}

function setReason(reason){

 state.reason=reason;

 if(reason==="change"){
   within60();
   return;
 }

 faultyFlow();
}

function within60(){

 app.innerHTML=`

 <div class="header">
 <h1>Return Period</h1>
 </div>

 <div class="content">

 <h2>Within 60 days?</h2>

 <br>

 <div class="option"
 onclick="within60Answer(true)">
 Yes
 </div>

 <div class="option"
 onclick="within60Answer(false)">
 No
 </div>

 </div>
 `;
}

function within60Answer(answer){

 if(answer){
   categoryQuestions();
   return;
 }

 onePass();
}

function onePass(){

 app.innerHTML=`

 <div class="header">
 <h1>OnePass</h1>
 </div>

 <div class="content">

 <h2>Is customer a OnePass member?</h2>

 <br>

 <div class="option"
 onclick="onePassMember(true)">
 Yes
 </div>

 <div class="option"
 onclick="onePassMember(false)">
 No
 </div>

 </div>
 `;
}

function onePassMember(answer){

 if(!answer){

   decline(
      "Outside return period."
   );

   return;
 }

 app.innerHTML=`

 <div class="header">
 <h1>OnePass</h1>
 </div>

 <div class="content">

 <h2>Within 365 days?</h2>

 <br>

 <div class="option"
 onclick="within365(true)">
 Yes
 </div>

 <div class="option"
 onclick="within365(false)">
 No
 </div>

 </div>
 `;
}

function within365(answer){

 if(!answer){

  decline(
   "Outside OnePass return period."
  );

  return;
 }

 categoryQuestions();
}

function categoryQuestions(){

 switch(state.category){

  case "footwear":
      footwearFlow();
      break;

  case "electrical":
      electricalFlow();
      break;

  default:
      approve(
       "Meets return requirements."
      );
 }
}

function footwearFlow(){

 app.innerHTML=`

 <div class="header">
 <h1>${state.product}</h1>
 </div>

 <div class="content">

 <h2>Have the shoes been worn outside?</h2>

 <br>

 <div class="option"
 onclick="footwearUsed(false)">
 No, tried on only
 </div>

 <div class="option"
 onclick="footwearUsed(true)">
 Yes
 </div>

 </div>
 `;
}

function footwearUsed(used){

 if(used){

   decline(
     "Item has been worn."
   );

   return;
 }

 approve(
  "Footwear appears resaleable."
 );
}

function electricalFlow(){

 app.innerHTML=`

 <div class="header">
 <h1>${state.product}</h1>
 </div>

 <div class="content">

 <h2>Condition</h2>

 <br>

 <div class="option"
 onclick="electricalResult('unopened')">
 Unopened
 </div>

 <div class="option"
 onclick="electricalResult('opened')">
 Opened but unused
 </div>

 <div class="option"
 onclick="electricalResult('used')">
 Used
 </div>

 </div>
 `;
}

function electricalResult(status){

 if(status==="used"){

   review(
     "Electrical item used. Review condition."
   );

   return;
 }

 approve(
   "Electrical item appears eligible."
 );
}

function faultyFlow(){

 review(
  "Assess under Consumer Guarantees policy."
 );
}

function approve(text){

 app.innerHTML=`

 <div class="content">

 <div class="banner green">
 ✅ APPROVED
 </div>

 <div class="card">
 ${text}
 </div>

 <button
 class="btn"
 onclick="home()">
 New Return
 </button>

 </div>
 `;
}

function decline(text){

 app.innerHTML=`

 <div class="content">

 <div class="banner red">
 ❌ DECLINED
 </div>

 <div class="card">
 ${text}
 </div>

 <button
 class="btn"
 onclick="home()">
 New Return
 </button>

 </div>
 `;
}

function review(text){

 app.innerHTML=`

 <div class="content">

 <div class="banner amber">
 ⚠ REVIEW REQUIRED
 </div>

 <div class="card">
 ${text}
 </div>

 <button
 class="btn"
 onclick="home()">
 New Return
 </button>

 </div>
 `;
}

home();

</script>

</body>
</html>
