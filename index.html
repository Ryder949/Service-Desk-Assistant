<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kmart Team Assistant</title>

<style>

:root{
  --kmart-blue:#0053A0;
  --kmart-red:#E1251B;
  --success:#16A34A;
  --warning:#FBBF24;
  --danger:#DC2626;
  --light:#f4f6f8;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:var(--light);
}

.container{
  max-width:500px;
  margin:auto;
  background:white;
  min-height:100vh;
}

.header{
  background:var(--kmart-blue);
  color:white;
  padding:30px 20px;
}

.header h1{
  font-size:28px;
}

.content{
  padding:20px;
}

.tiles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:15px;
}

.tile{
  height:110px;
  border:2px solid #ddd;
  border-radius:16px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}

.tile:hover{
  border-color:var(--kmart-blue);
}

.full-btn{
  width:100%;
  height:70px;
  border:none;
  border-radius:16px;
  background:var(--kmart-blue);
  color:white;
  font-size:18px;
  cursor:pointer;
}

.back{
  color:var(--kmart-blue);
  margin-bottom:20px;
  font-size:18px;
  cursor:pointer;
}

input[type="text"]{
  width:100%;
  padding:16px;
  font-size:18px;
  border:1px solid #ccc;
  border-radius:12px;
}

label{
  display:block;
  margin:12px 0;
  font-size:18px;
}

.primary-btn{
  width:100%;
  margin-top:20px;
  padding:16px;
  background:var(--kmart-blue);
  border:none;
  color:white;
  border-radius:12px;
  font-size:18px;
  cursor:pointer;
}

.category-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:20px;
}

.category-tile{
  border:2px solid #ddd;
  border-radius:16px;
  text-align:center;
  padding:20px;
  cursor:pointer;
}

.selected{
  background:var(--kmart-blue);
  color:white;
  border-color:var(--kmart-blue);
}

.banner{
  padding:20px;
  border-radius:16px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  margin-bottom:20px;
}

.green{
  background:var(--success);
  color:white;
}

.red{
  background:var(--danger);
  color:white;
}

.amber{
  background:var(--warning);
  color:black;
}

.card{
  border:1px solid #ddd;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
}

.card h3{
  margin-bottom:10px;
}

.spacer{
  height:15px;
}

</style>
</head>

<body>

<div class="container">
<div id="app"></div>
</div>

<script>

const app = document.getElementById("app");

const state = {
  receipt:null,
  product:null,
  category:null,
  reason:null
};

function home(){

app.innerHTML = `
<div class="header">
<h1>Kmart Team Assistant</h1>
</div>

<div class="content">

<div class="tiles">

<div class="tile">
Faulty Product
</div>

<div class="tile" onclick="returnsScreen()">
Returns
</div>

<div class="tile">
Marketplace
</div>

<div class="tile">
Target
</div>

</div>

<button class="full-btn">
Ask Policy Question
</button>

</div>
`;

}

function returnsScreen(){

app.innerHTML = `

<div class="header">
<h1>Returns</h1>
</div>

<div class="content">

<div class="back" onclick="home()">
← Back
</div>

<h2>Proof Of Purchase</h2>

<label>
<input type="radio" name="receipt" value="yes">
 Yes
</label>

<label>
<input type="radio" name="receipt" value="no">
 No
</label>

<div class="spacer"></div>

<h2>What product is being returned?</h2>

<input
type="text"
id="productInput"
onkeydown="handleEnter(event)"
>

</div>
`;

}

function handleEnter(event){

if(event.key !== "Enter") return;

const receipt =
document.querySelector(
'input[name="receipt"]:checked'
);

if(!receipt){
  alert("Select proof of purchase.");
  return;
}

state.receipt = receipt.value;

const product =
document
.getElementById("productInput")
.value
.trim();

if(product.length === 0){
  return;
}

state.product = product;

categoriseProduct();

}

function categoriseProduct(){

const value =
state.product.toLowerCase();

if(
value.includes("shirt") ||
value.includes("t-shirt") ||
value.includes("hoodie") ||
value.includes("jeans") ||
value.includes("dress")
){

state.category = "Clothing";

reasonScreen();

return;
}

if(
value.includes("toy") ||
value.includes("squid") ||
value.includes("doll") ||
value.includes("lego")
){

state.category = "Toys";

reasonScreen();

return;
}

if(
value.includes("air bed") ||
value.includes("quilt") ||
value.includes("sheet") ||
value.includes("pillow")
){

state.category = "Bedding";

reasonScreen();

return;
}

showCategorySelection(
"General Merchandise",
62,
"Furniture",
38
);

}

function showCategorySelection(
primary,
primaryConfidence,
backup,
backupConfidence
){

app.innerHTML = `

<div class="header">
<h1>${state.product}</h1>
</div>

<div class="content">

<h2>Select the best match</h2>

<div class="category-grid">

<div
class="category-tile"
onclick="selectCategory(this,'${primary}')">

${primary}
<br><br>
${primaryConfidence}%

</div>

<div
class="category-tile"
onclick="selectCategory(this,'${backup}')">

${backup}
<br><br>
${backupConfidence}%

</div>

</div>

<button
class="primary-btn"
onclick="continueCategory()">

Continue

</button>

</div>
`;

}

function selectCategory(tile, category){

document
.querySelectorAll(".category-tile")
.forEach(x=>x.classList.remove("selected"));

tile.classList.add("selected");

state.category = category;

}

function continueCategory(){

if(!state.category){
  alert("Select a category.");
  return;
}

reasonScreen();

}

function reasonScreen(){

app.innerHTML = `

<div class="header">
<h1>${state.product}</h1>
</div>

<div class="content">

<h2>Reason For Return</h2>

<label>
<input type="radio"
name="reason"
value="change">

 Change Of Mind
</label>

<label>
<input type="radio"
name="reason"
value="faulty">

 Faulty Product
</label>

<label>
<input type="radio"
name="reason"
value="missing">

 Missing Parts
</label>

<label>
<input type="radio"
name="reason"
value="damaged">

 Damaged Product
</label>

<button
class="primary-btn"
onclick="processReason()">

Continue

</button>

</div>
`;

}

function processReason(){

const selected =
document.querySelector(
'input[name="reason"]:checked'
);

if(!selected){

alert("Select a reason.");

return;

}

state.reason = selected.value;

if(state.reason === "change"){

returnPeriodScreen();

return;

}

loadCategoryQuestions();

}

function returnPeriodScreen(){

app.innerHTML = `

<div class="header">
<h1>Change Of Mind</h1>
</div>

<div class="content">

<h2>
Is the item within 60 days?
</h2>

<label>
<input type="radio"
name="period"
value="yes">

 Yes
</label>

<label>
<input type="radio"
name="period"
value="no">

 No
</label>

<button
class="primary-btn"
onclick="processReturnPeriod()">

Continue

</button>

</div>
`;

}

function processReturnPeriod(){

const answer =
document.querySelector(
'input[name="period"]:checked'
);

if(!answer){

alert("Select an option.");

return;

}

if(answer.value === "yes"){

loadCategoryQuestions();

return;

}

onePassScreen();

}

function onePassScreen(){

app.innerHTML = `

<div class="header">
<h1>OnePass</h1>
</div>

<div class="content">

<h2>
Is the customer a OnePass member?
</h2>

<label>
<input type="radio"
name="onepass"
value="yes">

 Yes
</label>

<label>
<input type="radio"
name="onepass"
value="no">

 No
</label>

<button
class="primary-btn"
onclick="processOnePass()">

Continue

</button>

</div>
`;

}

function processOnePass(){

const answer =
document.querySelector(
'input[name="onepass"]:checked'
);

if(!answer){

alert("Select an option.");

return;

}

if(answer.value === "no"){

declined(
"Unfortunately, the item is outside the eligible return period.",
"Item is outside the standard change of mind return period."
);

return;

}

onePassReturnScreen();

}

function onePassReturnScreen(){

app.innerHTML = `

<div class="header">
<h1>OnePass</h1>
</div>

<div class="content">

<h2>
Is the item within the OnePass return period?
</h2>

<label>
<input type="radio"
name="onepassperiod"
value="yes">

 Yes
</label>

<label>
<input type="radio"
name="onepassperiod"
value="no">

 No
</label>

<button
class="primary-btn"
onclick="processOnePassReturn()">

Continue

</button>

</div>
`;

}

function processOnePassReturn(){

const answer =
document.querySelector(
'input[name="onepassperiod"]:checked'
);

if(!answer){

alert("Select an option.");

return;

}

if(answer.value === "no"){

declined(
"Unfortunately, the item is outside the eligible OnePass return period.",
"Item is outside the OnePass change of mind return period."
);

return;

}

loadCategoryQuestions();

}

function loadCategoryQuestions(){

if(state.category === "Clothing"){

clothingQuestions();

return;

}

if(state.category === "Toys"){

toyQuestions();

return;

}

approved(
"No category-specific assessment required."
);

}

function clothingQuestions(){

app.innerHTML = `

<div class="header">
<h1>${state.product}</h1>
</div>

<div class="content">

<h2>Has the item been?</h2>

<label>
<input type="radio"
name="condition"
value="unused">
 Unused
</label>

<label>
<input type="radio"
name="condition"
value="tried">
 Tried On Only
</label>

<label>
<input type="radio"
name="condition"
value="worn">
 Worn / Used
</label>

<div class="spacer"></div>

<h2>Are the original tags attached?</h2>

<label>
<input type="radio"
name="tags"
value="yes">
 Yes
</label>

<label>
<input type="radio"
name="tags"
value="no">
 No
</label>

<button
class="primary-btn"
onclick="evaluateClothing()">

Continue

</button>

</div>
`;

}

function evaluateClothing(){

const condition =
document.querySelector(
'input[name="condition"]:checked'
);

const tags =
document.querySelector(
'input[name="tags"]:checked'
);

if(!condition || !tags){

alert("Complete all questions.");

return;

}

if(condition.value === "worn"){

declined(
"Unfortunately, I'm unable to process the return as the item has been worn.",
"Clothing has been worn or used."
);

return;

}

if(tags.value === "no"){

managerReview(
"Item is missing original tags. Review item condition and policy requirements."
);

return;

}

approved(
"Clothing meets assessment requirements."
);

}

function toyQuestions(){

app.innerHTML = `

<div class="header">
<h1>${state.product}</h1>
</div>

<div class="content">

<h2>
Has the toy been opened?
</h2>

<label>
<input type="radio"
name="opened"
value="yes">
 Yes
</label>

<label>
<input type="radio"
name="opened"
value="no">
 No
</label>

<button
class="primary-btn"
onclick="evaluateToy()">

Continue

</button>

</div>
`;

}

function evaluateToy(){

const opened =
document.querySelector(
'input[name="opened"]:checked'
);

if(!opened){

alert("Select an option.");

return;

}

if(opened.value === "yes"){

managerReview(
"Opened toy requires further assessment."
);

return;

}

approved(
"Toy remains eligible for assessment."
);

}

function approved(guidance){

app.innerHTML = `

<div class="content">

<div class="banner green">
✅ APPROVED
</div>

<div class="card">
<h3>Action</h3>
Process Return
</div>

<div class="card">
<h3>Customer Response</h3>
No worries. I can process that return for you today.
</div>

<div class="card">
<h3>Team Guidance</h3>
${guidance}
</div>

<button
class="primary-btn"
onclick="home()">
New Return
</button>

</div>
`;

}

function declined(message,guidance){

app.innerHTML = `

<div class="content">

<div class="banner red">
❌ DECLINED
</div>

<div class="card">
<h3>Action</h3>
Do Not Process Return
</div>

<div class="card">
<h3>Customer Response</h3>
${message}
</div>

<div class="card">
<h3>Team Guidance</h3>
${guidance}
</div>

<button
class="primary-btn"
onclick="home()">
New Return
</button>

</div>
`;

}

function managerReview(guidance){

app.innerHTML = `

<div class="content">

<div class="banner amber">
⚠ FURTHER REVIEW REQUIRED
</div>

<div class="card">
<h3>Action</h3>
Advise Manager
</div>

<div class="card">
<h3>Customer Response</h3>
I'd like to review this further before processing the return.
</div>

<div class="card">
<h3>Team Guidance</h3>
${guidance}
</div>

<button
class="primary-btn"
onclick="home()">
New Return
</button>

</div>
`;

}

home();

</script>

</body>
</html>
