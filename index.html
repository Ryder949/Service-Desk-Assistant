<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kmart Team Assistant</title>

<style>

:root{
--kmart-blue:#0053A0;
--kmart-red:#E1251B;
--success:#16A34A;
--warning:#FBBF24;
--danger:#DC2626;
--bg:#F5F6F8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
}

.container{
max-width:500px;
margin:auto;
min-height:100vh;
background:white;
}

.header{
background:var(--kmart-blue);
color:white;
padding:30px 20px;
}

.header h1{
font-size:28px;
margin-bottom:8px;
}

.header p{
opacity:.9;
}

.content{
padding:20px;
}

.tiles{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:15px;
}

.tile{
background:white;
border:2px solid #E5E7EB;
border-radius:16px;
height:110px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-weight:bold;
font-size:18px;
cursor:pointer;
}

.tile:hover{
border-color:var(--kmart-blue);
}

.full-width{
width:100%;
height:70px;
border:none;
background:var(--kmart-blue);
color:white;
border-radius:16px;
font-size:18px;
cursor:pointer;
}

.back{
color:var(--kmart-blue);
font-size:18px;
cursor:pointer;
margin-bottom:20px;
}

h2{
margin-bottom:15px;
}

label{
display:block;
margin:10px 0;
font-size:18px;
}

input[type="text"]{
width:100%;
padding:16px;
font-size:18px;
border-radius:12px;
border:1px solid #D1D5DB;
margin-bottom:15px;
}

.primary-btn{
width:100%;
padding:16px;
background:var(--kmart-blue);
color:white;
border:none;
border-radius:12px;
font-size:18px;
margin-bottom:12px;
cursor:pointer;
}

.secondary-btn{
width:100%;
padding:16px;
background:white;
color:var(--kmart-blue);
border:2px solid var(--kmart-blue);
border-radius:12px;
font-size:18px;
cursor:pointer;
}

.product-card{
background:#F8FAFC;
border:1px solid #E5E7EB;
border-radius:16px;
padding:18px;
margin-bottom:20px;
}

.product-name{
font-size:22px;
font-weight:bold;
margin-bottom:15px;
}

.product-field{
margin-bottom:10px;
}

.banner{
padding:20px;
border-radius:16px;
font-size:24px;
font-weight:bold;
text-align:center;
color:white;
margin-bottom:20px;
}

.green{
background:var(--success);
}

.red{
background:var(--danger);
}

.amber{
background:var(--warning);
color:black;
}

.card{
border:1px solid #E5E7EB;
border-radius:16px;
padding:16px;
margin-bottom:15px;
}

.card h3{
margin-bottom:10px;
}

.helper{
margin-top:15px;
padding:15px;
background:#F8FAFC;
border-radius:12px;
}

</style>
</head>

<body>

<div class="container">
<div id="app"></div>
</div>

<script>

const state = {};

const productDatabase = {

"43671335":{
sku:"43671335",
name:"Dancing Squid - Assorted",
price:"$5.00",
category:"toys"
},

"172678":{
sku:"172678",
name:"Print T-Shirt",
price:"$8.00",
category:"clothing"
}

};

const app = document.getElementById("app");

function home(){

app.innerHTML = `
<div class="header">
<h1>Kmart Team Assistant</h1>
<p>Returns & Policy Support</p>
</div>

<div class="content">

<div class="tiles">

<div class="tile">
Faulty Product
</div>

<div class="tile" onclick="returnsScreen()">
Returns
</div>

<div class="tile">
Marketplace
</div>

<div class="tile">
Target
</div>

</div>

<button class="full-width">
Ask Policy Question
</button>

</div>
`;
}

function returnsScreen(){

app.innerHTML = `
<div class="header">
<h1>Returns</h1>
</div>

<div class="content">

<div class="back" onclick="home()">← Back</div>

<h2>Proof Of Purchase</h2>

<label>
<input type="radio" name="receipt" value="yes">
 Yes
</label>

<label>
<input type="radio" name="receipt" value="no">
 No
</label>

<br>

<h2>Enter Product Name or SKU</h2>

<input id="productInput" type="text">

<button class="primary-btn"
onclick="identifyProduct()">

Identify Product

</button>

<div class="helper">

Need help finding a product?

<br><br>

<a href="https://www.kmart.com.au/"
target="_blank">

<button class="secondary-btn">
Open Kmart Website
</button>

</a>

</div>

</div>
`;
}

function identifyProduct(){

const receipt =
document.querySelector('input[name="receipt"]:checked');

if(!receipt){

alert("Select proof of purchase status");

return;

}

state.receipt = receipt.value;

const search =
document.getElementById("productInput")
.value
.trim();

const product =
lookupProduct(search);

if(!product){

productNotFound();

return;

}

state.product = product;

productConfirmation();

}

function lookupProduct(value){

if(productDatabase[value]){

return productDatabase[value];

}

const lower = value.toLowerCase();

for(const key in productDatabase){

if(productDatabase[key]
.name
.toLowerCase()
.includes(lower)){

return productDatabase[key];

}

}

return null;

}

function productConfirmation(){

app.innerHTML = `

<div class="header">
<h1>Product Identified</h1>
</div>

<div class="content">

<div class="product-card">

<div class="product-name">
${state.product.name}
</div>

<div class="product-field">
<b>SKU</b><br>
${state.product.sku}
</div>

<div class="product-field">
<b>Price</b><br>
${state.product.price}
</div>

</div>

<h2>Is this the correct item?</h2>

<label>
<input type="radio"
name="confirm"
value="yes">

 Yes
</label>

<label>
<input type="radio"
name="confirm"
value="no">

 No
</label>

<button class="primary-btn"
onclick="continueAfterConfirmation()">

Continue

</button>

</div>
`;

}

function continueAfterConfirmation(){

const confirm =
document.querySelector('input[name="confirm"]:checked');

if(!confirm){

alert("Confirm the product");

return;

}

if(confirm.value === "no"){

returnsScreen();

return;

}

reasonScreen();

}

function reasonScreen(){

app.innerHTML = `

<div class="header">
<h1>${state.product.name}</h1>
</div>

<div class="content">

<h2>Reason For Return</h2>

<label>
<input type="radio"
name="reason"
value="change">

 Change Of Mind
</label>

<label>
<input type="radio"
name="reason"
value="faulty">

 Faulty Product
</label>

<label>
<input type="radio"
name="reason"
value="missing">

 Missing Parts
</label>

<label>
<input type="radio"
name="reason"
value="damaged">

 Damaged Product
</label>

<button class="primary-btn"
onclick="loadQuestions()">

Continue

</button>

</div>
`;

}

function loadQuestions(){

const reason =
document.querySelector('input[name="reason"]:checked');

if(!reason){

alert("Select a reason");

return;

}

state.reason = reason.value;

if(
state.product.category === "clothing"
){

clothingQuestions();

return;

}

if(
state.product.category === "toys"
){

toyQuestions();

return;

}

managerReview(
"Item category not configured."
);

}

function clothingQuestions(){

app.innerHTML = `

<div class="header">
<h1>${state.product.name}</h1>
</div>

<div class="content">

<h2>Questions</h2>

<label>
Has the item been?
</label>

<label>
<input type="radio"
name="condition"
value="unused">

 Unused
</label>

<label>
<input type="radio"
name="condition"
value="tried">

 Tried On Only
</label>

<label>
<input type="radio"
name="condition"
value="worn">

 Worn / Used
</label>

<br>

<label>
Are original tags attached?
</label>

<label>
<input type="radio"
name="tags"
value="yes">

 Yes
</label>

<label>
<input type="radio"
name="tags"
value="no">

 No
</label>

<button
class="primary-btn"
onclick="evaluateClothing()">

Continue

</button>

</div>
`;

}

function evaluateClothing(){

const condition =
document.querySelector('input[name="condition"]:checked');

const tags =
document.querySelector('input[name="tags"]:checked');

if(!condition || !tags){

alert("Complete all questions");

return;

}

if(condition.value==="worn"){

declined(
"Unfortunately, I am unable to process the return as the item has been worn.",
"Item has been worn or used."
);

return;

}

if(tags.value==="yes"){

approved();

return;

}

managerReview(
"Item is missing tags. Further assessment required."
);

}

function toyQuestions(){

app.innerHTML = `

<div class="header">
<h1>${state.product.name}</h1>
</div>

<div class="content">

<h2>Questions</h2>

<label>
Has the toy been opened?
</label>

<label>
<input type="radio"
name="opened"
value="yes">

 Yes
</label>

<label>
<input type="radio"
name="opened"
value="no">

 No
</label>

<button
class="primary-btn"
onclick="evaluateToy()">

Continue

</button>

</div>
`;

}

function evaluateToy(){

const opened =
document.querySelector('input[name="opened"]:checked');

if(!opened){

alert("Complete all questions");

return;

}

if(opened.value==="no"){

approved();

return;

}

managerReview(
"Opened toy requires resaleable condition assessment."
);

}

function approved(){

app.innerHTML = `
<div class="content">

<div class="banner green">
✅ APPROVED
</div>

<div class="card">
<h3>Action</h3>
Process Return
</div>

<div class="card">
<h3>Customer Response</h3>
No worries. I can process that return for you today.
</div>

<div class="card">
<h3>Team Guidance</h3>
Item meets return requirements.
</div>

<button class="primary-btn"
onclick="home()">

New Return

</button>

</div>
`;
}

function declined(customer,guidance){

app.innerHTML=`
<div class="content">

<div class="banner red">
❌ DECLINED
</div>

<div class="card">
<h3>Action</h3>
Do Not Process Return
</div>

<div class="card">
<h3>Customer Response</h3>
${customer}
</div>

<div class="card">
<h3>Team Guidance</h3>
${guidance}
</div>

<button class="primary-btn"
onclick="home()">

New Return

</button>

</div>
`;
}

function managerReview(message){

app.innerHTML=`
<div class="content">

<div class="banner amber">
⚠ FURTHER REVIEW REQUIRED
</div>

<div class="card">
<h3>Action</h3>
Advise Manager
</div>

<div class="card">
<h3>Customer Response</h3>
I'd like to review this further before processing the return.
</div>

<div class="card">
<h3>Team Guidance</h3>
${message}
</div>

<button class="primary-btn"
onclick="home()">

New Return

</button>

</div>
`;
}

function productNotFound(){

app.innerHTML=`
<div class="content">

<div class="banner amber">
⚠ PRODUCT NOT FOUND
</div>

<div class="card">
<h3>Action</h3>
Advise Manager
</div>

<div class="card">
<h3>Customer Response</h3>
I'm unable to locate the product details at the moment.
</div>

<div class="card">
<h3>Team Guidance</h3>
Verify via Kmart website. If still not identified, advise manager.
</div>

<a href="https://www.kmart.com.au/"
target="_blank">

<button class="secondary-btn">
Open Kmart Website
</button>

</a>

<br><br>

<button class="primary-btn"
onclick="returnsScreen()">

Search Again

</button>

</div>
`;
}

home();

</script>

</body>
</html>
