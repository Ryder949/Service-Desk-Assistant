<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kmart Team Assistant</title>

<style>

:root{
    --kmart-blue:#0053A0;
    --kmart-red:#E1251B;
    --success:#16A34A;
    --warning:#FBBF24;
    --danger:#DC2626;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f5f7;
}

.container{
    max-width:500px;
    margin:auto;
    min-height:100vh;
    background:white;
}

.header{
    background:var(--kmart-blue);
    color:white;
    padding:30px 20px;
}

.header h1{
    font-size:28px;
}

.content{
    padding:20px;
}

.tiles{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:16px;
}

.tile{
    border:2px solid #ddd;
    border-radius:16px;
    height:110px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-weight:bold;
    cursor:pointer;
}

.tile:hover{
    border-color:var(--kmart-blue);
}

.full{
    width:100%;
    height:70px;
    border:none;
    border-radius:16px;
    background:var(--kmart-blue);
    color:white;
    font-size:18px;
}

.back{
    color:var(--kmart-blue);
    margin-bottom:20px;
    cursor:pointer;
}

input[type="text"]{
    width:100%;
    padding:16px;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:18px;
    margin-top:10px;
}

label{
    display:block;
    margin:12px 0;
    font-size:18px;
}

.category-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}

.category-tile{
    border:2px solid #ddd;
    border-radius:16px;
    padding:20px;
    text-align:center;
    cursor:pointer;
}

.selected{
    background:var(--kmart-blue);
    color:white;
    border-color:var(--kmart-blue);
}

.banner{
    padding:20px;
    border-radius:16px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:20px;
}

.green{
    background:var(--success);
    color:white;
}

.red{
    background:var(--danger);
    color:white;
}

.amber{
    background:var(--warning);
}

.card{
    border:1px solid #ddd;
    border-radius:16px;
    padding:16px;
    margin-bottom:15px;
}

.primary-btn{
    width:100%;
    padding:16px;
    margin-top:20px;
    border:none;
    border-radius:12px;
    background:var(--kmart-blue);
    color:white;
    font-size:18px;
}

</style>
</head>

<body>

<div class="container">
<div id="app"></div>
</div>

<script>

const app = document.getElementById("app");

const state = {};

function home(){

app.innerHTML = `

<div class="header">
<h1>Kmart Team Assistant</h1>
</div>

<div class="content">

<div class="tiles">

<div class="tile">
Faulty Product
</div>

<div class="tile" onclick="returnsScreen()">
Returns
</div>

<div class="tile">
Marketplace
</div>

<div class="tile">
Target
</div>

</div>

<button class="full">
Ask Policy Question
</button>

</div>
`;
}

function returnsScreen(){

app.innerHTML = `

<div class="header">
<h1>Returns</h1>
</div>

<div class="content">

<div class="back" onclick="home()">
← Back
</div>

<h2>Proof Of Purchase</h2>

<label>
<input type="radio" name="receipt" value="yes">
 Yes
</label>

<label>
<input type="radio" name="receipt" value="no">
 No
</label>

<br>

<h2>What product is being returned?</h2>

<input
type="text"
id="productInput"
placeholder=""
onkeydown="handleEnter(event)"
>

</div>

`;

}

function handleEnter(event){

if(event.key !== "Enter") return;

state.product =
document.getElementById("productInput")
.value
.trim();

if(!state.product) return;

categoriseProduct();

}

function categoriseProduct(){

const product =
state.product.toLowerCase();

if(product.includes("shirt")
|| product.includes("t-shirt")){

showReason("Clothing",96,
"General Merchandise",4);

return;

}

if(product.includes("air bed")){

showReason("Bedding",92,
"Furniture",8);

return;

}

if(product.includes("squid")
|| product.includes("toy")){

showReason("Toys",91,
"General Merchandise",9);

return;

}

showCategorySelection(
"General Merchandise",62,
"Furniture",38
);

}

function showReason(primary,p1,backup,p2){

if(p1 >= 85){

state.category = primary;

reasonScreen();

return;

}

showCategorySelection(primary,p1,backup,p2);

}

function showCategorySelection(primary,p1,backup,p2){

app.innerHTML = `

<div class="header">
<h1>${state.product}</h1>
</div>

<div class="content">

<h2>Select the best match</h2>

<div class="category-grid">

<div class="category-tile"
onclick="chooseCategory(this,'${primary}')">

${primary}<br><br>${p1}%

</div>

<div class="category-tile"
onclick="chooseCategory(this,'${backup}')">

${backup}<br><br>${p2}%

</div>

</div>

<button
class="primary-btn"
onclick="continueCategory()">

Continue

</button>

</div>

`;

}

function chooseCategory(tile,category){

document
.querySelectorAll(".category-tile")
.forEach(x=>x.classList.remove("selected"));

tile.classList.add("selected");

state.category = category;

}

function continueCategory(){

if(!state.category){

alert("Select a category");

return;

}

reasonScreen();

}

function reasonScreen(){

app.innerHTML = `

<div class="header">
<h1>${state.product}</h1>
</div>

<div class="content">

<h2>Reason For Return</h2>

<label>
<input type="radio" name="reason">
 Change Of Mind
</label>

<label>
<input type="radio" name="reason">
 Faulty Product
</label>

<label>
<input type="radio" name="reason">
 Missing Parts
</label>

<label>
<input type="radio" name="reason">
 Damaged Product
</label>

<button
class="primary-btn"
onclick="approved()">

Continue

</button>

</div>

`;

}

function approved(){

app.innerHTML = `

<div class="content">

<div class="banner green">
✅ APPROVED
</div>

<div class="card">

<h3>Action</h3>

Process Return

</div>

<div class="card">

<h3>Customer Response</h3>

No worries. I can process
that return for you today.

</div>

<div class="card">

<h3>Team Guidance</h3>

Item meets return requirements.

</div>

<button
class="primary-btn"
onclick="home()">

New Return

</button>

</div>

`;

}

home();

</script>

</body>

</html>
